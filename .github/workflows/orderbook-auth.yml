name: Orderbook server (auth)
on:
  push:
    branches: [auth]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install pinned Node.js (uWebSockets.js 20.49.0 has binaries for Node 18-22 only)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - name: Unpack the OrderBook-rs dependency
        working-directory: rust
        run: unzip -q OrderBook-rs.zip
      - name: BIP-322 verifier tests (official vectors)
        working-directory: rust/bip322-core
        run: cargo +1.90.0 test --locked
      - name: Build the matcher addon from source over the committed binary
        working-directory: rust/matcher-core
        run: |
          cargo +1.90.0 build --release --locked
          cp target/release/libmatcher_core.so matcher_core.node
      - name: Install packages (lifecycle scripts disabled)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Swap relay and login tests
        run: npm test
