[package]
name = "matcher-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["serde-json", "napi4"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.19"
hashbrown = "0.14"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
ulid = { version = "1", features = ["serde"] }
sha2 = "0.10"
bip322-core = { path = "../bip322-core" }

# ✅ single-line, unambiguous dependency
orderbook-rs = { path = "../OrderBook-rs" }
