[package]
name = "matcher-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.19"
hashbrown = "0.14"
pricelevel = "0.4.2"
uuid = { version = "1", features = ["v4", "serde"] }
ulid = { version = "1", features = ["serde"] }

# ✅ single-line, unambiguous dependency
orderbook-rs = { path = "../OrderBook-rs" }
